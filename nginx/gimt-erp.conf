# GIMT Enterprise ERP - Production Nginx Virtual Host Configuration
# Placement: /etc/nginx/sites-available/gimt-erp.conf
# Symlink:   ln -s /etc/nginx/sites-available/gimt-erp.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name erp.gimt.ac.in localhost;

    # Redirect all plain HTTP traffic to HTTPS in production
    # return 301 https://$host$request_uri;

    # Document Root (points to the public directory)
    root /var/www/html/public;
    index index.php index.html;

    # Character Set
    charset utf-8;

    # File Upload Limits
    client_max_body_size 32M;
    client_body_buffer_size 128k;

    # Production Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Logging
    access_log /var/log/nginx/gimt_erp_access.log;
    error_log  /var/log/nginx/gimt_erp_error.log warn;

    # Default URI Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # CRITICAL SECURITY: Block all script execution inside upload directories
    location ~* ^/uploads/.*\.(php|phtml|php3|php4|php5|php7|php8|phps|phar|cgi|pl|py|sh|bash|asp|aspx|jsp|exe)$ {
        deny all;
        return 403;
    }

    # Block access to hidden files and sensitive configuration files
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~* \.(env|sql|log|git|md|yml|yaml|json|lock|sh)$ {
        deny all;
        return 404;
    }

    # Static Assets Caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|woff|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Connect to Unix domain socket (or 127.0.0.1:9000 for Docker)
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        # fastcgi_pass 127.0.0.1:9000;

        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # FastCGI Timeouts for Long Report / Tabulation Processing
        fastcgi_read_timeout 180;
        fastcgi_send_timeout 180;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }
}
