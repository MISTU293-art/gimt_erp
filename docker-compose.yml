version: '3.8'

services:
  # GIMT ERP Web Application Container (PHP 8.2 + Apache)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gimt_erp_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: Asia/Kolkata
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gimt_erp
      DB_USERNAME: gimt_user
      DB_PASSWORD: GimtSecurePassword2026!
      DB_CHARSET: utf8mb4
    volumes:
      - ./uploads:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gimt_network

  # Relational Database Container (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: gimt_erp_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: RootSecurePassword2026!
      MYSQL_DATABASE: gimt_erp
      MYSQL_USER: gimt_user
      MYSQL_PASSWORD: GimtSecurePassword2026!
    volumes:
      - gimt_db_data:/var/lib/mysql
      - ./gimt_erp_v2.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootSecurePassword2026!"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gimt_network

volumes:
  gimt_db_data:
    driver: local

networks:
  gimt_network:
    driver: bridge
